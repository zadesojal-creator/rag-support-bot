<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Support Bot (Debug)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .chat-container {
      width: 100%; max-width: 760px;
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      display: flex; flex-direction: column;
      height: 85vh; overflow: hidden;
    }
    .chat-header {
      background: #1a1a2e; color: #fff;
      padding: 18px 24px; font-size: 18px; font-weight: 600;
    }
    .debug-bar {
      background: #fef3c7; color: #92400e;
      padding: 8px 16px; font-size: 12px;
      font-family: monospace; border-bottom: 1px solid #fcd34d;
      word-break: break-all;
    }
    .chat-messages {
      flex: 1; padding: 20px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 14px;
      background: #fafafa;
    }
    .message {
      max-width: 85%; padding: 12px 16px; border-radius: 12px;
      line-height: 1.55; font-size: 15px; white-space: pre-wrap;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end; background: #2563eb; color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start; background: #fff; color: #1f2937;
      border: 1px solid #e5e7eb; border-bottom-left-radius: 4px;
    }
    .message.bot.thinking { color: #6b7280; font-style: italic; }
    .message.bot.error { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
    .sources {
      margin-top: 10px; border-top: 1px dashed #d1d5db;
      padding-top: 8px; font-size: 13px; color: #4b5563;
    }
    .sources summary {
      cursor: pointer; font-weight: 600; color: #2563eb;
    }
    .sources pre {
      white-space: pre-wrap; background: #f9fafb; padding: 8px;
      border-radius: 6px; margin-top: 6px; font-size: 12px;
      max-height: 200px; overflow-y: auto;
    }
    .chat-input-area {
      display: flex; padding: 16px; gap: 10px;
      border-top: 1px solid #e5e7eb; background: #fff;
    }
    .chat-input-area input {
      flex: 1; padding: 12px 16px; border: 1px solid #d1d5db;
      border-radius: 10px; font-size: 15px; outline: none;
    }
    .chat-input-area button {
      padding: 12px 24px; background: #2563eb; color: #fff;
      border: none; border-radius: 10px; font-size: 15px;
      font-weight: 600; cursor: pointer;
    }
    .chat-input-area button:disabled {
      background: #93c5fd; cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">Company Support Bot (RAG) — Debug Mode</div>
    <div class="debug-bar" id="debugBar">
      Loading debug info...
    </div>
    <div class="chat-messages" id="messages">
      <div class="message bot">
        Hi! Ask me anything. If something goes wrong, a red error message will appear here.
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="questionInput"
             placeholder="Type your question..." autocomplete="off" />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    // Show exactly where this page is loaded from and where it will fetch
    const debugBar = document.getElementById("debugBar");
    const apiUrl = "/query";
    debugBar.textContent = "Page URL: " + window.location.href + "  |  Will POST to: " + apiUrl;

    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("questionInput");
    const sendBtn = document.getElementById("sendBtn");

    sendBtn.addEventListener("click", sendQuestion);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendQuestion();
    });

    function addMessage(text, sender, extraClass = "") {
      const div = document.createElement("div");
      div.className = `message ${sender} ${extraClass}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return div;
    }

    function addBotMessageWithSources(answer, sources) {
      const div = document.createElement("div");
      div.className = "message bot";
      const answerPara = document.createElement("div");
      answerPara.textContent = answer;
      div.appendChild(answerPara);

      if (sources && sources.length) {
        const details = document.createElement("details");
        details.className = "sources";
        const summary = document.createElement("summary");
        summary.textContent = `View ${sources.length} retrieved chunks`;
        details.appendChild(summary);
        sources.forEach((src, i) => {
          const pre = document.createElement("pre");
          pre.textContent = `[Chunk ${i + 1}]\n${src}`;
          details.appendChild(pre);
        });
        div.appendChild(details);
      }

      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendQuestion() {
      const question = input.value.trim();
      if (!question) return;

      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;

      addMessage(question, "user");
      const thinkingMsg = addMessage("Thinking...", "bot", "thinking");

      try {
        console.log("Sending request to:", apiUrl, "with body:", { question });

        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        console.log("Response received. Status:", response.status);

        const rawText = await response.text();
        console.log("Raw response body:", rawText);

        if (!response.ok) {
          throw new Error(`Server returned ${response.status}: ${rawText}`);
        }

        const data = JSON.parse(rawText);
        thinkingMsg.remove();
        addBotMessageWithSources(data.answer, data.sources);

      } catch (err) {
        thinkingMsg.remove();
        addMessage("ERROR: " + err.message, "bot", "error");
        console.error("Fetch failed:", err);
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // Catch any uncaught errors on the page
    window.addEventListener("error", (e) => {
      addMessage("JS ERROR: " + e.message, "bot", "error");
    });
  </script>
</body>
</html>
